---
# Route 1: protected by ExternalAuth on the broad /http prefix.
# Requests to /http/allowed pass through the auth server and are allowed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-auth-per-route-scope-with-auth
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /http
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: external-auth-http
          port: 9002
        http:
          allowedHeaders: ~
    backendRefs:
    - name: infra-backend-v1
      port: 8080
---
# Route 2: no ExternalAuth filter. Matches /http/denied which is a more
# specific prefix than /http, so this route wins for that path.
# If ExternalAuth were applied at listener/HCM level rather than per-route,
# the auth server would receive /http/denied and return 403; the test catches
# that by asserting 200 from the backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: external-auth-per-route-scope-without-auth
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /http/denied
    backendRefs:
    - name: infra-backend-v1
      port: 8080
